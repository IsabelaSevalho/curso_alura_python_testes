[pytest]

# addopts define quais instruções vao ser executadas
#addopts = -v --cov=models --cov-report=term-missing

# Verifica se determinado modulo (controller, services, config) está coberto por testes
addopts = -v --cov=models --cov=controllers --cov=services --cov=config --cov-report=term-missing --cov-fail-under=80